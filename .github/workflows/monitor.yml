name: Nagoya Badminton Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 23,0-14 * * *'

permissions:
  contents: write

concurrency:
  group: nagoya-badminton-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install browser fallback dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Monitor available courts (read only)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 monitor.py
      - name: Save notified slots and failed-date backlog
        run: |
          if [ -n "$(git status --porcelain -- seen.json failed_dates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json failed_dates.json
            git commit -m "Update monitor state [skip ci]"
            git push
          fi
