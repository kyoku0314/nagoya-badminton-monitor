name: Nagoya Badminton Monitor

on:
  workflow_dispatch:
    inputs:
      test_discord_only:
        description: "Only test Discord webhook (skip court monitoring)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '2,17,32,47 23,0-14 * * *'

permissions:
  contents: write

concurrency:
  group: nagoya-badminton-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ inputs.test_discord_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install browser fallback dependencies
        run: |
          set -e
          python3 -m pip install --retries 5 --timeout 30 playwright
          for attempt in 1 2; do
            echo "Browser dependency installation attempt ${attempt}/2"
            if timeout 180 python3 -m playwright install chromium; then
              echo "Browser dependencies installed successfully"
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Temporary installation failure; retrying in 30 seconds..."
              sleep 30
            fi
          done
          echo "::error::Browser dependency installation failed after 2 attempts"
          exit 1
      - name: Monitor available courts (read only)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 monitor.py
      - name: Upload browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            browser_failure.png
            browser_failure.html
          if-no-files-found: ignore
          retention-days: 3
      - name: Save notified slots and failed-date backlog
        run: |
          if [ -n "$(git status --porcelain -- seen.json failed_dates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json failed_dates.json
            git commit -m "Update monitor state [skip ci]"
            git push
          fi

  test_discord:
    if: ${{ inputs.test_discord_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not url:
              raise SystemExit("ERROR: DISCORD_WEBHOOK_URL secret is missing or empty")
          if not url.startswith(("https://discord.com/api/webhooks/", "https://discordapp.com/api/webhooks/")):
              raise SystemExit("ERROR: Webhook URL format is unexpected; check the GitHub secret")
          data = json.dumps({"content": "🏸 名古屋羽毛球监控：Discord Webhook 测试消息（不查询场地）"}).encode()
          request = urllib.request.Request(url, data=data, headers={
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord test succeeded, HTTP", response.status)
          except urllib.error.HTTPError as error:
              print("Discord test failed, HTTP", error.code)
              print("Response body (truncated):", error.read(350).decode("utf-8", "replace"))
              raise SystemExit(1)
          except urllib.error.URLError as error:
              print("Discord network error:", type(error.reason).__name__)
              raise SystemExit(1)
          PY
