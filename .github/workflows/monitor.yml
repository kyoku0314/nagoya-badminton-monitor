name: Nagoya Badminton Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 23,0-14 * * *'

permissions:
  contents: write

concurrency:
  group: nagoya-badminton-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Monitor available courts (read only)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 monitor.py
      - name: Save notified slots
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update notified court slots [skip ci]"
            git push
          fi
