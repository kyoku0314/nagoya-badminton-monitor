name: Deploy Cloudflare Watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-watchdog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -f cloudflare/wrangler.toml || { echo "::error::Missing cloudflare/wrangler.toml: first import existing Worker source"; exit 1; }
          test -f cloudflare/index.js || { echo "::error::Missing cloudflare/index.js: first import existing Worker source"; exit 1; }
      - name: Deploy existing watchdog with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
